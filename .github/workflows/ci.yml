name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Only the latest run per branch matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly the committed lockfile, so CI cannot pass on
      # a dependency tree the repository does not describe.
      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run build
